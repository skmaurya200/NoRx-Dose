<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="A doctor in a white coat holding a clipboard">
  <!--
    Default portrait image: a practitioner.

    Deliberately drawn rather than photographed - a stock face on a wellness
    site reads as a stock face, and this holds the layout honestly until a real
    photograph is uploaded.
  -->
  <defs>
    <linearGradient id="portrait-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFD8"/>
      <stop offset="1" stop-color="#F2EEE3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#portrait-bg)"/>
  <circle cx="300" cy="300" r="196" fill="#E8D9A8" opacity=".45"/>

  <g transform="translate(300 250)">
    <!-- head -->
    <circle cx="0" cy="0" r="74" fill="#14130F" opacity=".82"/>
    <path d="M-74 -8a74 74 0 0 1 148 0v-8a74 74 0 0 0-148 0z" fill="#14130F"/>

    <!-- stethoscope, the one detail that says what the coat is for -->
    <path d="M-40 58c0 62 80 62 80 0" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 58v72a30 30 0 0 0 60 0v-18" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
    <circle cx="100" cy="106" r="17" fill="#C9A227"/>
    <circle cx="100" cy="106" r="8" fill="#F7EFD8"/>
  </g>

  <!-- the coat -->
  <path d="M300 322c-96 0-168 52-168 132v346h336V454c0-80-72-132-168-132z" fill="#FFFFFF"/>
  <path d="M300 322l-46 30 46 62 46-62z" fill="#F2EEE3"/>
  <path d="M300 414v386" stroke="#E7E2D6" stroke-width="4"/>

  <!-- lapels -->
  <path d="M254 352l46 62-88 58z" fill="#F7F4EC"/>
  <path d="M346 352l-46 62 88 58z" fill="#F7F4EC"/>

  <!-- breast pocket with a pen -->
  <rect x="356" y="486" width="72" height="86" rx="6" fill="#F7F4EC" stroke="#E7E2D6" stroke-width="3"/>
  <rect x="386" y="466" width="10" height="52" rx="5" fill="#C9A227"/>

  <!-- clipboard -->
  <g transform="translate(126 512)">
    <rect x="0" y="0" width="150" height="196" rx="10" fill="#14130F" opacity=".9"/>
    <rect x="12" y="14" width="126" height="168" rx="6" fill="#FAF7F0"/>
    <rect x="52" y="-10" width="46" height="22" rx="7" fill="#C9A227"/>
    <g fill="#D9CFAF">
      <rect x="30" y="48" width="90" height="8" rx="4"/>
      <rect x="30" y="74" width="70" height="8" rx="4"/>
      <rect x="30" y="100" width="82" height="8" rx="4"/>
      <rect x="30" y="126" width="58" height="8" rx="4"/>
    </g>
    <path d="M30 154l14 14 26-30" fill="none" stroke="#C9A227" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
