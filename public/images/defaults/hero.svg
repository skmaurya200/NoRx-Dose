<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A pharmacy counter with supplement bottles and lab glassware">
  <!--
    Default hero image: a pharmacy bench.

    Drawn rather than photographed so it scales to any screen, weighs a few
    kilobytes and uses the site's own palette. It is shown until someone
    uploads a real photograph from the Pages module.
  -->
  <defs>
    <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1C16"/>
      <stop offset="1" stop-color="#14130F"/>
    </linearGradient>
    <linearGradient id="hero-glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2519"/>
      <stop offset="1" stop-color="#1A170F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hero-sky)"/>
  <ellipse cx="1150" cy="180" rx="620" ry="430" fill="url(#hero-glow)"/>

  <!-- shelving behind the bench -->
  <g stroke="#3A331F" stroke-width="3" opacity=".55">
    <line x1="180" y1="215" x2="1420" y2="215"/>
    <line x1="180" y1="385" x2="1420" y2="385"/>
  </g>

  <!-- jars on the upper shelf -->
  <g opacity=".5">
    <rect x="300" y="140" width="52" height="72" rx="9" fill="#3A331F"/>
    <rect x="372" y="152" width="44" height="60" rx="8" fill="#4A4128"/>
    <rect x="436" y="132" width="60" height="80" rx="10" fill="#3A331F"/>
    <rect x="1080" y="146" width="48" height="66" rx="9" fill="#4A4128"/>
    <rect x="1148" y="130" width="56" height="82" rx="10" fill="#3A331F"/>
  </g>

  <!-- the bench top -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#hero-bench)"/>
  <rect x="0" y="620" width="1600" height="4" fill="#C9A227" opacity=".35"/>

  <!-- centre bottle -->
  <g transform="translate(690 372)">
    <rect x="52" y="0" width="76" height="34" rx="8" fill="#C9A227"/>
    <rect x="30" y="30" width="120" height="30" rx="9" fill="#E3C766" opacity=".45"/>
    <rect x="18" y="52" width="144" height="200" rx="22" fill="#FAF7F0"/>
    <rect x="38" y="96" width="104" height="86" rx="11" fill="#F7EFD8"/>
    <rect x="56" y="118" width="68" height="8" rx="4" fill="#C9A227"/>
    <rect x="64" y="140" width="52" height="6" rx="3" fill="#D9CFAF"/>
    <rect x="72" y="158" width="36" height="6" rx="3" fill="#D9CFAF"/>
    <rect x="38" y="200" width="104" height="6" rx="3" fill="#EFEBE0"/>
    <rect x="38" y="216" width="72" height="6" rx="3" fill="#EFEBE0"/>
  </g>

  <!-- left bottle, a little behind -->
  <g transform="translate(470 428)" opacity=".92">
    <rect x="40" y="0" width="58" height="26" rx="6" fill="#C9A227"/>
    <rect x="14" y="24" width="110" height="168" rx="18" fill="#F2EEE3"/>
    <rect x="32" y="60" width="74" height="62" rx="9" fill="#E8DFC9"/>
    <rect x="46" y="78" width="46" height="6" rx="3" fill="#C9A227"/>
    <rect x="52" y="96" width="34" height="5" rx="2.5" fill="#CFC6A9"/>
  </g>

  <!-- right bottle -->
  <g transform="translate(908 444)" opacity=".92">
    <rect x="34" y="0" width="52" height="24" rx="6" fill="#C9A227"/>
    <rect x="10" y="22" width="100" height="152" rx="17" fill="#F2EEE3"/>
    <rect x="26" y="54" width="68" height="56" rx="9" fill="#E8DFC9"/>
    <rect x="38" y="70" width="44" height="6" rx="3" fill="#C9A227"/>
    <rect x="44" y="88" width="32" height="5" rx="2.5" fill="#CFC6A9"/>
  </g>

  <!-- conical flask -->
  <g transform="translate(1128 452)">
    <path d="M46 0h30v58l50 96a18 18 0 0 1-16 27H12a18 18 0 0 1-16-27l50-96z"
          fill="none" stroke="#E8D9A8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M6 128h110l14 26a18 18 0 0 1-16 27H8a18 18 0 0 1-16-27z" fill="#C9A227" opacity=".5"/>
    <line x1="40" y1="0" x2="82" y2="0" stroke="#E8D9A8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- mortar and pestle -->
  <g transform="translate(360 560)" opacity=".8">
    <path d="M0 20h120a60 60 0 0 1-120 0z" fill="#4A4128"/>
    <rect x="52" y="-34" width="12" height="52" rx="6" fill="#6B5C38" transform="rotate(18 58 -8)"/>
  </g>

  <!-- scattered capsules on the bench -->
  <g opacity=".75">
    <rect x="1310" y="646" width="44" height="17" rx="8.5" fill="#E3C766" transform="rotate(-14 1332 654)"/>
    <rect x="1364" y="672" width="44" height="17" rx="8.5" fill="#C9A227" transform="rotate(9 1386 680)"/>
    <rect x="1268" y="686" width="44" height="17" rx="8.5" fill="#E3C766" transform="rotate(24 1290 694)"/>
  </g>

  <!-- a soft vignette so overlaid text stays readable -->
  <rect width="1600" height="900" fill="#14130F" opacity=".18"/>
</svg>
