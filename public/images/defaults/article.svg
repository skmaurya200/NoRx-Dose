<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="An open journal beside a supplement bottle and capsules">
  <!--
    Default journal cover: an open notebook on a bench.

    Shown on a post card and at the top of a post whenever no cover has been
    uploaded, so the grid never collapses around a missing picture.
  -->
  <defs>
    <linearGradient id="article-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EFD8"/>
      <stop offset="1" stop-color="#EFE8D6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#article-bg)"/>
  <circle cx="540" cy="60" r="118" fill="#E8D9A8" opacity=".55"/>

  <!-- open journal -->
  <g transform="translate(150 96)">
    <path d="M0 12C36-6 108-6 168 12v170c-60-18-132-18-168 0z" fill="#FFFFFF" stroke="#E7E2D6" stroke-width="4"/>
    <path d="M336 12C300-6 228-6 168 12v170c60-18 132-18 168 0z" fill="#FAF7F0" stroke="#E7E2D6" stroke-width="4"/>
    <line x1="168" y1="12" x2="168" y2="182" stroke="#E7E2D6" stroke-width="4"/>
    <g fill="#D9CFAF">
      <rect x="30" y="50" width="106" height="7" rx="3.5"/>
      <rect x="30" y="72" width="84" height="7" rx="3.5"/>
      <rect x="30" y="94" width="98" height="7" rx="3.5"/>
      <rect x="200" y="50" width="106" height="7" rx="3.5"/>
      <rect x="200" y="72" width="72" height="7" rx="3.5"/>
      <rect x="200" y="94" width="92" height="7" rx="3.5"/>
    </g>
    <rect x="30" y="122" width="52" height="9" rx="4.5" fill="#C9A227"/>
  </g>

  <!-- bottle -->
  <g transform="translate(64 138)">
    <rect x="20" y="0" width="34" height="16" rx="5" fill="#C9A227"/>
    <rect x="6" y="14" width="62" height="106" rx="13" fill="#FFFFFF" stroke="#E7E2D6" stroke-width="3"/>
    <rect x="18" y="42" width="38" height="34" rx="6" fill="#F7EFD8"/>
    <rect x="26" y="54" width="22" height="5" rx="2.5" fill="#C9A227"/>
  </g>

  <!-- capsules -->
  <g opacity=".85">
    <rect x="512" y="252" width="46" height="18" rx="9" fill="#C9A227" transform="rotate(-14 535 261)"/>
    <rect x="556" y="278" width="46" height="18" rx="9" fill="#E3C766" transform="rotate(10 579 287)"/>
  </g>
</svg>
