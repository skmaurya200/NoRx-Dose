<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="A prescription note, a stethoscope and a supplement bottle">
  <!--
    Default small landscape image. Sits in the collage on the home page, so it
    is drawn simply enough to read at a couple of hundred pixels wide.
  -->
  <rect width="480" height="300" fill="#14130F"/>
  <circle cx="392" cy="58" r="118" fill="#C9A227" opacity=".18"/>

  <!-- note -->
  <g transform="translate(46 62)">
    <rect x="0" y="0" width="150" height="186" rx="10" fill="#FAF7F0"/>
    <rect x="22" y="26" width="60" height="9" rx="4.5" fill="#C9A227"/>
    <g fill="#D9CFAF">
      <rect x="22" y="56" width="106" height="8" rx="4"/>
      <rect x="22" y="80" width="84" height="8" rx="4"/>
      <rect x="22" y="104" width="98" height="8" rx="4"/>
      <rect x="22" y="128" width="66" height="8" rx="4"/>
    </g>
    <path d="M22 158l12 12 24-26" fill="none" stroke="#C9A227" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- stethoscope -->
  <g transform="translate(228 74)" fill="none" stroke="#E8D9A8" stroke-width="9" stroke-linecap="round">
    <path d="M0 0v42a44 44 0 0 0 88 0V0"/>
    <path d="M44 86v46a30 30 0 0 0 60 0v-16"/>
  </g>
  <circle cx="332" cy="182" r="19" fill="#C9A227"/>
  <circle cx="332" cy="182" r="9" fill="#14130F"/>

  <!-- bottle -->
  <g transform="translate(374 108)">
    <rect x="18" y="0" width="34" height="17" rx="5" fill="#C9A227"/>
    <rect x="4" y="15" width="62" height="104" rx="13" fill="#FAF7F0"/>
    <rect x="16" y="42" width="38" height="34" rx="6" fill="#F7EFD8"/>
    <rect x="24" y="54" width="22" height="5" rx="2.5" fill="#C9A227"/>
  </g>
</svg>
